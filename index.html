<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Anggia 💛</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #333;
      text-align: center;
      background: linear-gradient(270deg, #FFD54F, #FFB74D, #FFF176, #FFCDD2);
      background-size: 800% 800%;
      animation: bg 15s ease infinite;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    @keyframes bg {
      0% {background-position: 0%}
      50% {background-position: 100%}
      100% {background-position: 0%}
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 700px;
      width: 100%;
      padding: 20px;
    }

    h1 { font-size: 2em; margin-bottom: 10px; }
    h2 { margin-bottom: 25px; }

    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .date {
      margin: 15px 0;
      font-weight: 600;
    }

    .poem {
      min-height: 160px;
      line-height: 1.9;
      font-size: clamp(15px, 2.5vw, 18px);
      padding: 0 10px;
      transition: opacity 0.6s ease;
    }

    .fade-out { opacity: 0; }
    .fade-in { opacity: 1; }

    footer {
      margin-top: 25px;
      font-size: 13px;
      opacity: 0.8;
    }

    #musicControl {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 16px;
      border-radius: 30px;
      background: linear-gradient(135deg, #FFD54F, #FFB74D);
      display: flex;
      gap: 8px;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 8px 25px rgba(255,193,7,0.5);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .heart {
      position: fixed;
      bottom: -10px;
      font-size: 20px;
      animation: up linear infinite;
      color: #ffcc00;
    }

    @keyframes up {
      to {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="RahasiaHati.mp3" type="audio/mpeg">
</audio>

<div id="musicControl" onclick="toggleMusic()">
  ▶ Play Music
</div>

<canvas id="particles"></canvas>

<div class="container">
  <h1>💛 Happy Birthday 💛</h1>
  <h2>Anggia Bintang Aprilliza</h2>

  <div class="card">
    <div class="date">
      17 April 2004 — 17 April 2026
    </div>

    <div class="poem" id="poem"></div>
  </div>

  <footer>
    made with love 💛 and github pages
  </footer>
</div>

<script>
  const music = document.getElementById("bgMusic");
  let play = false;
  let started = false;

  function toggleMusic() {
    if (!play) {
      music.volume = 0.4;
      music.play();
      play = true;

      if (!started) {
        started = true;
        setTimeout(showParagraph, 1000);
      }
    } else {
      music.pause();
      play = false;
    }
  }

  // PARTICLES
  const c = document.getElementById("particles");
  const ctx = c.getContext("2d");
  c.width = innerWidth;
  c.height = innerHeight;

  let p = [];
  for(let i=0;i<130;i++){
    p.push({
      x:Math.random()*c.width,
      y:Math.random()*c.height,
      dx:(Math.random()-0.5),
      dy:(Math.random()-0.5),
      s:Math.random()*2
    });
  }

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    p.forEach(e=>{
      e.x+=e.dx;
      e.y+=e.dy;
      ctx.beginPath();
      ctx.arc(e.x,e.y,e.s,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,200,0.7)";
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();

  // HEART
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💛";
    h.style.left = Math.random()*100 + "vw";
    h.style.animationDuration = (Math.random()*3+3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  }, 250);

  // PUISI (6 DETIK)
  const paragraphs = [
"Di antara hari-hari\nyang terus berlari,\nada satu tanggal\nyang selalu punya arti.",
"Bukan hanya tentang\nbertambah usia,\ntapi tentang kamu...\nyang tetap sama hangatnya.",
"Seperti kuning\nyang tidak pernah redup,\nseperti pagi\nyang selalu cukup\nuntuk membuat dunia terasa hidup.",
"Dan seperti bintang\ndi langit malam,\nkamu tetap bersinar\ndiam-diam,\ntanpa meminta perhatian,\ntapi selalu jadi tujuan.",
"Terima kasih\nsudah ada,\ndi dunia ini...\ndan di hidup aku.",
"Semoga langkahmu ringan,\nsenyummu tak kehilangan alasan,\ndan saat dunia terasa berat,",
"ingat...\naku selalu di sini,\nmenjadi tempat pulangmu nanti."
  ];

  const poem = document.getElementById("poem");
  let i = 0;

  function showParagraph() {
    if (i < paragraphs.length) {
      poem.classList.add("fade-out");

      setTimeout(() => {
        poem.innerText = paragraphs[i];
        poem.classList.remove("fade-out");
        poem.classList.add("fade-in");

        i++;
        setTimeout(showParagraph, 6000); // 🔥 lebih lama
      }, 600);
    }
  }
</script>

</body>
</html>
